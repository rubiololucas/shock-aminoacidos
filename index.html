:root {
  --bg: #000;
  --fg: #fff;
  --line: rgba(255, 255, 255, 0.14);
  --line-strong: rgba(255, 255, 255, 0.32);
  --card: rgba(255, 255, 255, 0.03);
  --card-hover: rgba(255, 255, 255, 0.06);
  --muted: rgba(255, 255, 255, 0.55);
  --muted-2: rgba(255, 255, 255, 0.38);
  --eyebrow: 0.72rem;
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  min-height: 100%;
  background: var(--bg);
  color: var(--fg);
  font-family: "Trivial", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica,
    Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* fondo tecnológico: glow superior + grilla muy sutil */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: -2;
  background: radial-gradient(
      1100px 620px at 50% -8%,
      rgba(255, 255, 255, 0.07),
      transparent 62%
    ),
    #000;
}
body::after {
  content: "";
  position: fixed;
  inset: 0;
  z-index: -1;
  background-image: linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
  background-size: 46px 46px;
  mask-image: radial-gradient(circle at 50% 30%, #000 0%, transparent 78%);
  -webkit-mask-image: radial-gradient(circle at 50% 30%, #000 0%, transparent 78%);
  pointer-events: none;
}

a {
  color: inherit;
  text-decoration: none;
}

.eyebrow {
  font-size: var(--eyebrow);
  font-weight: 700;
  letter-spacing: 0.34em;
  text-transform: uppercase;
  color: var(--muted);
}

/* ===== Topbar ===== */
.topbar {
  position: sticky;
  top: 0;
  z-index: 5;
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 22px;
  border-bottom: 1px solid var(--line);
  background: rgba(0, 0, 0, 0.6);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}
.topbar img {
  height: 16px;
  width: auto;
  opacity: 0.92;
}
.topbar .tag {
  font-size: 0.62rem;
  font-weight: 700;
  letter-spacing: 0.26em;
  text-transform: uppercase;
  color: var(--muted-2);
}

/* ===== HOME ===== */
.hero {
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 40px 24px;
  gap: 0;
}
.hero .eyebrow {
  animation: fadeUp 0.6s ease both;
}
.hero-logo {
  width: clamp(220px, 62vw, 360px);
  height: auto;
  margin: 22px 0 30px;
  animation: fadeUp 0.7s ease 0.05s both;
}
.hero h1 {
  margin: 0 0 8px;
  font-weight: 900;
  font-size: clamp(2.1rem, 8vw, 3.6rem);
  letter-spacing: 0.01em;
  line-height: 0.98;
  text-transform: uppercase;
  animation: fadeUp 0.7s ease 0.1s both;
}
.hero .sub {
  margin: 0 0 40px;
  max-width: 30ch;
  font-weight: 300;
  font-size: 1rem;
  line-height: 1.5;
  color: var(--muted);
  animation: fadeUp 0.7s ease 0.16s both;
}

.controls {
  width: 100%;
  max-width: 440px;
  animation: fadeUp 0.7s ease 0.22s both;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.field {
  position: relative;
  width: 100%;
  text-align: left;
}
.field-label {
  display: block;
  margin: 0 0 7px 2px;
  font-size: 0.68rem;
  font-weight: 700;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--muted-2);
}
.field-label + select,
.field select {
  margin: 0;
}
.field:has(.field-label)::after {
  top: calc(50% + 13px);
}
.field select {
  appearance: none;
  -webkit-appearance: none;
  width: 100%;
  background: var(--card);
  color: var(--fg);
  border: 1px solid var(--line-strong);
  border-radius: 12px;
  padding: 20px 56px 20px 22px;
  font-family: inherit;
  font-size: 1.02rem;
  font-weight: 500;
  text-align: left;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  cursor: pointer;
  transition: border-color 0.18s ease, background 0.18s ease;
}
.field select:hover {
  border-color: var(--fg);
}
.field select:focus {
  outline: none;
  border-color: var(--fg);
  background: var(--card-hover);
}
.field::after {
  content: "";
  position: absolute;
  right: 24px;
  top: 50%;
  width: 11px;
  height: 11px;
  border-right: 2px solid var(--fg);
  border-bottom: 2px solid var(--fg);
  transform: translateY(-65%) rotate(45deg);
  pointer-events: none;
  opacity: 0.8;
}
.cta {
  margin-top: 14px;
  width: 100%;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  background: var(--fg);
  color: #000;
  border: 1px solid var(--fg);
  border-radius: 12px;
  padding: 20px 22px;
  font-family: inherit;
  font-size: 1rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  cursor: pointer;
  transition: transform 0.15s ease, opacity 0.15s ease, background 0.15s ease,
    color 0.15s ease;
}
.cta .arrow {
  transition: transform 0.18s ease;
}
.cta:not(:disabled):hover {
  transform: translateY(-1px);
}
.cta:not(:disabled):hover .arrow {
  transform: translateX(4px);
}
.cta:disabled {
  background: transparent;
  color: var(--muted-2);
  border-color: var(--line);
  cursor: not-allowed;
}

/* ===== CONSUMO ===== */
.wrap {
  width: 100%;
  max-width: 760px;
  margin: 0 auto;
  padding: 40px 22px 96px;
  animation: fadeUp 0.6s ease both;
}
.back {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 40px;
  font-size: 0.78rem;
  font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--muted);
  transition: color 0.15s ease, gap 0.15s ease;
}
.back:hover {
  color: var(--fg);
  gap: 12px;
}

.head h1 {
  margin: 10px 0 14px;
  font-weight: 900;
  font-size: clamp(2.3rem, 8.5vw, 4rem);
  letter-spacing: 0.005em;

function guideHTML(slug){
 const c=CAFETERAS.find(x=>x.slug===slug);
 return `<div class="guide"><div class="guide-head"><h3>${esc(c.nombre)}</h3><span class="badge">${esc(c.metodo)}</span></div>
  <p class="guide-intro">${esc(c.intro)}</p>
  <div class="params">${c.params.map(p=>`<div class="param"><span class="param-label">${esc(p[0])}</span><span class="param-value">${esc(p[1])}</span></div>`).join("")}</div>
  <ol class="pasos">${c.pasos.map((p,i)=>`<li><span class="paso-n">${pad(i+1)}</span><span>${esc(p)}</span></li>`).join("")}</ol></div>`;
}
function renderPrep(){
 document.getElementById("guidebox").innerHTML=guideHTML(CURSEL);
 document.querySelectorAll(".chip").forEach(ch=>ch.classList.toggle("chip-active",ch.dataset.slug===CURSEL));
}

  <main class="wrap">
    <span class="back" id="back">← Volver</span>
    <div class="head"><span class="eyebrow">Tu Shock</span><h1>${esc(p.nombre)}</h1><p class="lead">${esc(p.resumen)}</p></div>
    <section class="section"><div class="section-title"><h2>Qué te llevaste</h2></div>
      <div class="facts">${p.facts.map(f=>`<span class="fact">${esc(f)}</span>`).join("")}</div>
      <ul class="beneficios">${p.beneficios.map(b=>`<li>${esc(b)}</li>`).join("")}</ul></section>

      ${p.notaPrep?`<p class="callout">${esc(p.notaPrep)}</p>`:""}
      ${p.cuandoTomar?`<div class="when"><span class="when-label">¿Cuándo tomarlo?</span><p>${esc(p.cuandoTomar)}</p></div>`:""}
      ${p.booster?`<div class="when"><span class="when-label">Cómo usar el Booster</span><p>${esc(p.booster)}</p></div>`:""}
    </section>
    <section class="section"><div class="section-title"><h2>Cómo prepararlo</h2><span class="count">Elegí tu cafetera</span></div>

      <div id="guidebox"></div>
    </section>
    <section class="section"><div class="section-title"><h2>Recomendaciones</h2><span class="count">Para el mejor efecto</span></div>
      <div class="recs">${RECO.map((r,i)=>`<div class="rec"><span class="n">${pad(i+1)}</span><div><h3>${esc(r.t)}</h3><p>${esc(r.x)}</p></div></div>`).join("")}</div></section>
    <p class="foot">Bienvenido al Shock</p>
  </main>`;

}
