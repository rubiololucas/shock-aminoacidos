:root {
  --bg: #000;
  --fg: #ffffff;
  --body: rgba(255, 255, 255, 0.82);
  --muted: rgba(255, 255, 255, 0.58);
  --muted-2: rgba(255, 255, 255, 0.42);
  --line: rgba(255, 255, 255, 0.12);
  --line-strong: rgba(255, 255, 255, 0.26);
  --card: rgba(255, 255, 255, 0.035);
  --card-hover: rgba(255, 255, 255, 0.07);

  --font-display: "Trivial", -apple-system, BlinkMacSystemFont, "Segoe UI",
    sans-serif;
  --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
    Arial, "Apple Color Emoji", sans-serif;
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  min-height: 100%;
  background: var(--bg);
  color: var(--body);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
}

/* fondo: glow superior sutil */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: -1;
  background: radial-gradient(
      900px 520px at 50% -10%,
      rgba(255, 255, 255, 0.05),
      transparent 60%
    ),
    #000;
  pointer-events: none;
}

a {
  color: inherit;
  text-decoration: none;
}

/* Display = Trivial. Body = sans del sistema. */
.eyebrow,
.tag,
.field-label,
.section-title h2,
.head h1,
.hero h1,
.dose-hero .big,
.method h3,
.rec h3,
.rec .n,
.guide-head h3,
.badge,
.chip,
.cta,
.fact,
.paso-n,
.foot {
  font-family: var(--font-display);
}

.eyebrow {
  font-size: 0.7rem;
  font-weight: 700;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--muted);
}

/* ===== Topbar ===== */
.topbar {
  position: sticky;
  top: 0;
  z-index: 5;
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 20px;
  border-bottom: 1px solid var(--line);
  background: rgba(0, 0, 0, 0.7);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}
.topbar img {
  height: 15px;
  width: auto;
  opacity: 0.85;
}
.topbar .tag {
  font-size: 0.6rem;
  font-weight: 700;
  letter-spacing: 0.24em;
  text-transform: uppercase;
  color: var(--muted-2);
}

/* ===== HOME ===== */
.hero {
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 26px 24px 56px;
}
.hero-logo {
  width: 88px;
  height: auto;
  opacity: 0.5;
  flex: 0 0 auto;
  animation: fadeUp 0.5s ease both;
}
.hero-center {
  flex: 1 1 auto;
  width: 100%;
  max-width: 420px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
}
.hero h1 {
  margin: 14px 0 10px;
  font-weight: 900;
  font-size: clamp(1.7rem, 6.5vw, 2.4rem);
  letter-spacing: 0.01em;
  line-height: 1.02;
  text-transform: uppercase;
  color: var(--fg);
  animation: fadeUp 0.6s ease 0.06s both;
}
.hero .sub {
  margin: 0 0 34px;
  max-width: 34ch;
  font-size: 0.95rem;
  line-height: 1.6;
  color: var(--muted);
  animation: fadeUp 0.6s ease 0.12s both;
}

.controls {
  width: 100%;
  max-width: 420px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  animation: fadeUp 0.6s ease 0.18s both;
}
.field {
  position: relative;
  width: 100%;
  text-align: left;
}
.field-label {
  display: block;
  margin: 0 0 7px 2px;
  font-size: 0.64rem;
  font-weight: 700;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--muted-2);
}
.field select {
  appearance: none;
  -webkit-appearance: none;
  width: 100%;
  background: var(--card);
  color: var(--fg);
  border: 1px solid var(--line-strong);
  border-radius: 12px;
  padding: 16px 50px 16px 18px;
  font-family: var(--font-body);
  font-size: 1rem;
  font-weight: 500;
  text-align: left;
  letter-spacing: 0;
  text-transform: none;
  cursor: pointer;
  transition: border-color 0.18s ease, background 0.18s ease;
}
.field select:hover {
  border-color: var(--fg);
}
.field select:focus {
  outline: none;
  border-color: var(--fg);
  background: var(--card-hover);
}
.field::after {
  content: "";
  position: absolute;
  right: 20px;
  top: calc(50% + 13px);
  width: 9px;
  height: 9px;
  border-right: 2px solid var(--muted);
  border-bottom: 2px solid var(--muted);
  transform: translateY(-65%) rotate(45deg);
  pointer-events: none;
}
.cta {
  margin-top: 6px;
  width: 100%;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  background: var(--fg);
  color: #000;
  border: 1px solid var(--fg);
  border-radius: 12px;
  padding: 16px 20px;
  font-size: 0.92rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  cursor: pointer;
  transition: transform 0.15s ease, opacity 0.15s ease;
}
.cta .arrow {
  transition: transform 0.18s ease;
}
.cta:not(:disabled):hover {
  transform: translateY(-1px);
}
.cta:not(:disabled):hover .arrow {
  transform: translateX(4px);
}
.cta:disabled {
  background: transparent;
  color: var(--muted-2);
  border-color: var(--line);
  cursor: not-allowed;
}

/* ===== CONSUMO ===== */
.wrap {
  width: 100%;
  max-width: 680px;
  margin: 0 auto;
  padding: 32px 22px 90px;
  animation: fadeUp 0.5s ease both;
}
.back {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 34px;
  font-size: 0.8rem;
  font-weight: 500;
  letter-spacing: 0.02em;
  color: var(--muted);
  transition: color 0.15s ease, gap 0.15s ease;
}
.back:hover {
  color: var(--fg);
  gap: 12px;
}

.head h1 {
  margin: 10px 0 12px;
  font-weight: 900;
  font-size: clamp(1.7rem, 6vw, 2.4rem);
  letter-spacing: 0.01em;
  line-height: 1.03;
  text-transform: uppercase;
  color: var(--fg);
}
.head .lead {
  margin: 0;
  max-width: 60ch;
  font-size: 1rem;
  line-height: 1.6;
  color: var(--muted);
}

.section {
  margin-top: 44px;
}
.section-title {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 14px;
  margin-bottom: 20px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--line);
}
.section-title h2 {
  margin: 0;
  font-weight: 900;
  font-size: 1.1rem;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--fg);
}
.section-title .count {
  font-family: var(--font-body);
  font-size: 0.74rem;
  font-weight: 500;
  letter-spacing: 0.02em;
  color: var(--muted-2);
}

/* Qué te llevaste */
.facts {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  margin-bottom: 20px;
}
.fact {
  font-size: 0.68rem;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  padding: 6px 11px;
  border: 1px solid var(--line-strong);
  border-radius: 999px;
  color: var(--body);
}
.beneficios {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  gap: 11px;
}
.beneficios li {
  position: relative;
  padding-left: 24px;
  font-size: 0.96rem;
  line-height: 1.55;
  color: var(--body);
}
.beneficios li::before {
  content: "";
  position: absolute;
  left: 2px;
  top: 0.62em;
  width: 7px;
  height: 7px;
  border-right: 2px solid var(--fg);
  border-bottom: 2px solid var(--fg);
  transform: rotate(-45deg);
}

/* Dosis */
.dose-hero {
  display: flex;
  align-items: center;
  gap: 20px;
  padding: 22px 22px;
  margin-bottom: 18px;
  border: 1px solid var(--line-strong);
  border-radius: 16px;
  background: rgba(255, 255, 255, 0.04);
}
.dose-hero .big {
  font-weight: 900;
  font-size: clamp(2rem, 8vw, 2.6rem);
  line-height: 0.95;
  letter-spacing: 0;
  white-space: nowrap;
  color: var(--fg);
}
.dose-hero .big span {
  display: block;
  font-family: var(--font-body);
  font-size: 0.7rem;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  margin-top: 4px;
  color: var(--muted);
}
.dose-hero .desc {
  margin: 0;
  font-size: 0.95rem;
  line-height: 1.6;
  color: var(--muted);
}
.dose-hero .desc b {
  color: var(--body);
  font-weight: 600;
}

.callout {
  margin: 0 0 14px;
  padding: 14px 16px;
  border-left: 2px solid var(--fg);
  background: var(--card);
  border-radius: 0 8px 8px 0;
  font-size: 0.93rem;
  line-height: 1.55;
  color: var(--body);
}
.when {
  margin-top: 14px;
  padding: 16px 18px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--card);
}
.when-label {
  display: block;
  margin-bottom: 5px;
  font-family: var(--font-display);
  font-size: 0.66rem;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--fg);
}
.when p {
  margin: 0;
  font-size: 0.95rem;
  line-height: 1.6;
  color: var(--muted);
}
.when-text {
  margin: 0;
  font-size: 1rem;
  line-height: 1.6;
  color: var(--muted);
  max-width: 60ch;
}

/* Selector de cafetera */
.cafetera-tabs {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 20px;
}
.chip {

  background: transparent;

  font-weight: 700;

.chip-icon {
  display: inline-flex;
}
.chip-icon svg {
  width: 16px;
  height: 16px;
  display: block;
}
.chip:hover {
  color: var(--fg);

}
.chip-active {
  background: var(--fg);
  color: #000;
  border-color: var(--fg);

.guide {

}
.guide-head {

  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 10px;
}
.guide-head h3 {

  font-weight: 900;
  font-size: 1.15rem;
  letter-spacing: 0.02em;

  border-radius: 999px;
  color: var(--muted);
}
.guide-intro {

  font-size: 0.96rem;
  line-height: 1.6;
  color: var(--muted);
}

  margin-bottom: 22px;
}
.param {

  border: 1px solid var(--line);
  border-radius: 10px;
  background: rgba(0, 0, 0, 0.25);

.param-label {

  font-family: var(--font-display);
  font-size: 0.6rem;
  font-weight: 700;

  font-weight: 400;
  line-height: 1.4;
  color: var(--body);

.pasos {

  margin: 0;
  padding: 0;
  display: grid;
  gap: 13px;
}
.pasos li {
  display: flex;
  gap: 13px;
  font-size: 0.95rem;
  line-height: 1.55;
  color: var(--body);
}
.paso-n {

  font-weight: 900;
  font-size: 0.78rem;
  color: var(--muted-2);

  gap: 12px;
}
.rec {

  gap: 18px;
  padding: 20px 20px;

  border-radius: 14px;
  background: var(--card);
  transition: border-color 0.18s ease, background 0.18s ease;
}
.rec:hover {
  border-color: var(--line-strong);
  background: var(--card-hover);
}
.rec .n {

  font-size: 1.5rem;
  line-height: 1;
  color: var(--line-strong);

.rec h3 {
  margin: 1px 0 6px;
  font-weight: 900;
  font-size: 0.95rem;
  letter-spacing: 0.03em;

    <div class="field"><label class="field-label">Tu Shock</label>
     <select id="sel"><option value="" disabled selected>Elegí tu producto</option>${PRODUCTOS.map(p=>`<option value="${p.slug}">${esc(p.nombre)}</option>`).join("")}</select></div>
    <div class="field"><label class="field-label">Tu cafetera (opcional)</label>
     <select id="caf"><option value="">¿Qué cafetera tenés?</option>${CAFETERAS.map(c=>`<option value="${c.slug}">${esc(c.nombre)}</option>`).join("")}</select></div>
    <button class="cta" id="go" disabled>Ver cómo consumirlo <span class="arrow">→</span></button>
   </div>
  </div></main>`;
 const sel=document.getElementById("sel"),caf=document.getElementById("caf"),go=document.getElementById("go");
 sel.onchange=()=>{go.disabled=!sel.value};
 go.onclick=()=>{if(sel.value)consumo(sel.value,caf.value||"filtro")};
}
function guideHTML(slug){
 const c=CAFETERAS.find(x=>x.slug===slug);
 const pasos=armarPasos(c,CURPROD.cucharadas,CURPROD.booster);
 return `<div class="guide"><div class="guide-head"><h3>${esc(c.nombre)}</h3><span class="badge">${esc(c.metodo)}</span></div>
  <p class="guide-intro">${esc(c.intro)}</p>
  <div class="params">${c.params.map(p=>`<div class="param"><span class="param-label">${esc(p[0])}</span><span class="param-value">${esc(p[1])}</span></div>`).join("")}</div>
  <ol class="pasos">${pasos.map((p,i)=>`<li><span class="paso-n">${pad(i+1)}</span><span>${esc(p)}</span></li>`).join("")}</ol></div>`;
}
function renderPrep(){
 document.getElementById("guidebox").innerHTML=guideHTML(CURSEL);
 document.querySelectorAll(".chip").forEach(ch=>ch.classList.toggle("chip-active",ch.dataset.slug===CURSEL));
}
